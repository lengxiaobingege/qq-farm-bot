    repeated Item next_level_rewards = 4;
}

// ==================== 补充：从其它包 import 的类型（此处自包含定义） ====================
// userpb.ShareInfo：分享次数与领取状态（牧场版本字段，与本地 userpb 同名消息字段不同）
message ShareInfo {
    int64 share_count = 1;
    bool is_claimed = 2;
}

// shoppb.ShowCond：商品购买条件
message ShowCond {
    string type = 1;
    string params = 2;
}
