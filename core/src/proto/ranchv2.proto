syntax = "proto3";
package gamepb.ranchv2;

// 牧场（大农场，global_scene_id=2）协议的独立命名空间。
//
// 为什么单独建包：本地 core/src/proto/animalpb.proto 与 homesteadpb.proto 里的
// HarvestRanch / FeedAnimal / GetRanchDetail 等消息是按本地抓包手写的字段编号，
// 与按官方定义整理的牧场版本字段语义不同。
// 若复用同名消息会被本地定义覆盖，导致解码错位。
// 因此这里把牧场三份协议（animalpb / homesteadpb / ranchpb）合并为一个
// 自包含的包，加载后在 proto.ts 里以 Ranch<消息名> 注册，供 services/ranch 使用。
//
// 命名替换：corepb.Item -> Item, corepb.ItemEntry -> ItemEntry,
//          corepb.FacilityOpResult -> FacilityOpResult,
//          gamepb.shoppb.ShowCond -> ShowCond, gamepb.userpb.ShareInfo -> ShareInfo。

// ==================== homesteadpb：家园格子 / 建筑 / 设施 ====================




// 从 QQ 1.17.0.3 官方定义整理，服务层只开放已核实的动作。

message CellInfo {
    int64 cell_id = 1;
    int32 grid_x = 2;
    int32 grid_y = 3;
    int32 status = 4;
    int64 occupied_by = 5;
    int32 region_id = 6;
    repeated Item unlock_need = 7;
    int64 unlock_end_time = 10;
    int32 unlock_secs = 11;
    bool can_share_unlock = 12;
    repeated Item share_cost = 13;
}

message FacilityInfo {
    int64 instance_id = 1;
    int32 facility_id = 2;
    int32 module_type = 3;
    int32 position_x = 4;
    int32 position_y = 5;
    int32 rotation = 6;
    int32 level = 7;
    int32 width = 8;
    int32 height = 9;
    int32 capacity = 10;
    repeated int64 occupied_cell_ids = 11;
    RanchDetail ranch = 20;
    FeedMachineDetail feed_machine = 21;
    bytes order_board = 22;
    int32 state = 12;
    int32 upgrade_state = 13;
    int64 upgrade_end_time = 14;
}

message AllCellsRequest {

}

message AllCellsReply {
    int32 grid_width = 1;
    int32 grid_height = 2;
    repeated CellInfo cells = 3;
    repeated FacilityInfo facilities = 4;
    repeated BuildingItemInfo building_items = 5;
    bool has_ready_upgrade = 6;
    int32 region_occupied_count = 7;
    int32 region_quota_count = 8;
    SpeedUpInfo region_speed_up = 9;
}

message RefreshCellsRequest {
    repeated int64 cell_ids = 1;
    int64 host_gid = 2;
}

message RefreshCellsReply {
    repeated CellInfo cells = 1;
    repeated FacilityInfo facilities = 2;
}

message UnlockRegionRequest {
    int32 region_id = 1;
    bool do_shared = 2;
}

message UnlockRegionReply {
    repeated CellInfo cells = 1;
    repeated FacilityInfo facilities = 2;
    int32 region_occupied_count = 3;
    int32 region_quota_count = 4;
}

message SpeedUpRegionUnlockRequest {
    int32 region_id = 1;
    int32 count = 2;
    int64 item_id = 3;
}

message SpeedUpRegionUnlockReply {
    repeated CellInfo cells = 1;
    repeated Item consumed = 2;
}

message CompleteRegionUnlockRequest {
    int32 region_id = 1;
}

message CompleteRegionUnlockReply {
    repeated CellInfo cells = 1;
    repeated FacilityInfo facilities = 2;
    int32 region_occupied_count = 3;
    int32 region_quota_count = 4;
}

message PlaceFacilityRequest {
    int64 inst_id = 1;
    int32 position_x = 2;
    int32 position_y = 3;
    int32 rotation = 4;
}

message PlaceFacilityReply {
    FacilityInfo facility = 1;
}

message MoveFacilityRequest {
    int64 instance_id = 1;
    int32 new_position_x = 2;
    int32 new_position_y = 3;
    int32 new_rotation = 4;
}

message MoveFacilityReply {
    FacilityInfo facility = 1;
}

message RemoveFacilityRequest {
    int64 instance_id = 1;
}

message RemoveFacilityReply {
    BuildingItemInfo item = 1;
}

message ActivateFacilityRequest {
    int64 instance_id = 1;
}

message ActivateFacilityReply {
    FacilityInfo facility = 1;
}

message UpgradeBuildingRequest {
    int64 inst_id = 1;
}

message UpgradeBuildingReply {
    BuildingUpgradeInfo upgrade = 1;
}

message CellsNotify {
    repeated CellInfo cells = 1;
    int64 host_gid = 2;
}

message RegionQuotaNotify {
    int64 host_gid = 1;
    int32 region_occupied_count = 2;
    int32 region_quota_count = 3;
}

message FacilitiesNotify {
    repeated FacilityInfo facilities = 1;
    int64 host_gid = 2;
}

message FacilitySummaryInfo {
    int64 instance_id = 1;
    string name = 2;
    int32 base_facility_id = 3;
    int32 module_type = 4;
    repeated Item upgrade_cost = 5;
    int32 level = 6;
    int32 facility_id = 7;
    int32 position_x = 8;
    int32 position_y = 9;
    int32 rotation = 10;
    int32 width = 11;
    int32 height = 12;
    int32 capacity = 13;
    RanchDetail ranch = 20;
    EmptyFacilitySummary empty_summary = 99;
    FeedMachineDetail feed_machine = 21;
    bytes order_board = 22;
}

message GetFacilityInfoRequest {
    int64 instance_id = 1;
    int64 host_gid = 2;
}

message GetFacilityInfoReply {
    FacilitySummaryInfo info = 1;
}

message FacilityDetailInfo {
    int64 instance_id = 1;
    string name = 2;
    string description = 3;
    int32 base_facility_id = 4;
    int32 module_type = 5;
    repeated Item upgrade_cost = 6;
    int32 level = 7;
    int32 facility_id = 8;
    int32 position_x = 9;
    int32 position_y = 10;
    int32 rotation = 11;
    int32 width = 12;
    int32 height = 13;
    int32 capacity = 14;
    RanchDetail ranch = 20;
    EmptyFacilityDetail empty_detail = 99;
    FeedMachineDetail feed_machine = 21;
    bytes order_board = 22;
}

message GetFacilityDetailRequest {
    int64 instance_id = 1;
    int64 host_gid = 2;
}

message GetFacilityDetailReply {
    FacilityDetailInfo info = 1;
}

message EmptyFacilitySummary {

}

message EmptyFacilityDetail {

}

message FeedMachineDetail {
    int32 feed_count = 1;
    int32 consume_rate = 2;
    int64 remaining_secs = 4;
    bool is_owner = 7;
    int32 status = 8;
}

message AddFeedRequest {
    int64 instance_id = 1;
    int32 add_count = 2;
    bool use_gold = 3;
    int64 host_gid = 4;
}

message AddFeedReply {
    FeedMachineDetail detail = 1;
    repeated Item consumed = 2;
}

message BuildingItemInfo {
    int64 inst_id = 1;
    int32 facility_id = 2;
    int32 level = 3;
    int32 upgrade_state = 5;
    int64 upgrade_end_time = 6;
    int64 added_at = 7;
    bool is_new = 8;
}

message BuildingUpgradeInfo {
    int64 inst_id = 1;
    int32 state = 2;
    int64 end_time = 3;
    int32 target_facility_id = 4;
    int32 target_level = 5;
}

message GetBuildingListRequest {

}

message GetBuildingListReply {
    repeated BuildingItemInfo items = 1;
    bool has_ready_upgrade = 2;
}

message SpeedUpBuildingUpgradeRequest {
    int64 inst_id = 1;
    int32 count = 2;
    int64 item_id = 3;
}

message MarkBuildingKnownRequest {
    repeated int64 inst_ids = 1;
}

message MarkBuildingKnownReply {
    int32 marked_count = 1;
}

message SpeedUpBuildingUpgradeReply {
    BuildingUpgradeInfo upgrade = 1;
    repeated Item consumed = 2;
}

message CompleteBuildingUpgradeRequest {
    int64 inst_id = 1;
}

message CompleteBuildingUpgradeReply {
    FacilityInfo facility = 1;
    BuildingItemInfo item = 2;
}

message BuildingListChangedNotify {
    repeated BuildingItemInfo added = 1;
    repeated int64 removed_inst_ids = 2;
}

message SpeedUpInfo {
    int64 item_id = 1;
    int64 own_count = 2;
    int32 secs_per_item = 3;
}

message MainCityInfo {
    bool has_main_city = 1;
    int64 inst_id = 2;
    string name = 3;
    int32 level = 4;
    BuildingUpgradeInfo upgrade = 5;
    int32 next_level = 6;
    repeated Item upgrade_cost = 7;
    int32 upgrade_secs = 8;
    repeated int64 next_unlock_goods_ids = 9;
    int32 region_open_quota = 10;
    int32 next_region_open_quota = 11;
    SpeedUpInfo speed_up = 12;
}

message FacilityGoodsInfo {
    int64 goods_id = 1;
    int32 facility_id = 2;
    int32 base_facility_id = 3;
    int32 module_type = 4;
    string name = 5;
    repeated Item cost = 6;
    int32 main_city_level = 7;
    int32 sort = 8;
    int32 state = 9;
    int32 built_count = 10;
    int32 max_count = 11;
    bool is_new = 12;
}

message GetMainCityInfoRequest {
    int32 source = 1;
}

message GetMainCityInfoReply {
    MainCityInfo main_city = 1;
    repeated FacilityGoodsInfo goods = 2;
}

message BuyBuildingRequest {
    int64 goods_id = 1;
}

message BuyBuildingReply {
    repeated BuildingItemInfo items = 1;
    repeated Item consumed = 2;
    FacilityGoodsInfo goods = 3;
}

message MarkGoodsKnownRequest {
    repeated int64 goods_ids = 1;
}

message MarkGoodsKnownReply {
    int32 marked_count = 1;
}


// ==================== animalpb：牧场动物 / 货架 / 灾害 / 操作 ====================



// 从 QQ 1.17.0.3 官方定义整理，服务层只开放已核实的动作。

message AnimalRef {
    int64 ranch_inst_id = 1;
    int32 animal_inst_id = 2;
}

message ShelfRef {
    int64 ranch_inst_id = 1;
    int32 slot_index = 2;
}

message AnimalLotSource {
    int64 animal_id = 1;
    int32 src_animal_inst_id = 2;
    int64 byproduct_item_id_override = 3;
}

message RanchDetail {
    int64 ranch_inst_id = 1;
    int32 capacity = 2;
    int32 animal_count = 3;
    repeated AnimalDetail animals = 4;
    GrassInfo grass = 5;
    int32 husbandry_type = 6;
    repeated ShelfDetail shelves = 7;
    repeated RanchHazardView hazards = 8;
}

message AnimalDetail {
    int64 ranch_inst_id = 1;
    int32 slot_index = 2;
    int32 animal_inst_id = 3;
    int64 animal_id = 4;
    int32 stage = 5;
    int32 produce_count = 6;
    bool can_harvest = 7;
    int64 grow_ready_at_ms = 10;
    int64 produce_ready_at_ms = 11;
    bool grass_blocked = 12;
    int64 infant_ready_at_ms = 14;
    bool producing = 15;
    bool can_deliver = 16;
    int64 delivering_until_ms = 17;
    bool can_feed = 18;
    bool limited_can_used = 19;
    bool can_donate = 20;
    int64 expected_harvest_exp = 21;
    repeated ItemEntry expected_harvest_sells = 22;
    int64 expected_produce_exp = 23;
    repeated ItemEntry expected_produce_sells = 24;
    int64 mature_ready_at_ms = 25;
    AnimalMutationView mutation = 30;
}

message AnimalMutationView {
    int32 mutation_type = 1;
    int32 source = 2;
    int32 weight_display_x10 = 3;
    int32 scale_bp = 4;
    int32 weight_final_x10 = 5;
    int32 tier = 6;
    int64 became_at_ms = 7;
    bool strokable = 8;
    repeated int64 stroked_gids = 9;
}

message ProductLotDetail {
    int64 item_id = 1;
    int64 base_num = 2;
    int64 remain_num = 3;
    int64 stolen_num = 4;
    int64 animal_id = 5;
    bool can_steal = 6;
    repeated int64 stealers = 7;
}

message ShelfDetail {
    int32 slot_index = 1;
    repeated ProductLotDetail lots = 2;
    int64 total_remain = 3;
    bool can_collect = 4;
    bool can_steal = 5;
}

message GrassInfo {
    int64 amount = 1;
    int64 empty_at_ms = 2;
}

message PlaceAnimalItem {
    int64 ranch_inst_id = 1;
    int64 animal_id = 2;
    int64 giant_cub_item_id = 3;
}

message PlaceAnimalRequest {
    repeated PlaceAnimalItem items = 1;
}

message PlaceAnimalReply {
    repeated RanchDetail ranches = 1;
    repeated FacilityOpResult op_results = 3;
}

message TriggerProduceRequest {
    int64 host_gid = 1;
    repeated AnimalRef targets = 2;
}

message TriggerProduceReply {
    repeated RanchDetail ranches = 1;
    repeated FacilityOpResult op_results = 3;
}

message DonateAnimalRequest {
    repeated AnimalRef targets = 1;
}

message DonateAnimalReply {
    repeated RanchDetail ranches = 1;
    repeated FacilityOpResult op_results = 2;
}

message StealProduceRequest {
    int64 host_gid = 1;
    repeated ShelfRef targets = 2;
}

message GetRanchDetailRequest {
    int64 host_gid = 1;
    repeated int64 ranch_inst_ids = 2;
}

message GetRanchDetailReply {
    repeated RanchDetail ranches = 1;
    int64 interval = 2;
}

message FeedAnimalRequest {
    repeated AnimalRef targets = 1;
    int32 bucket_type = 2;
}

message FeedAnimalReply {
    repeated RanchDetail ranches = 1;
    int64 deduct_secs = 2;
    int64 bucket_remain_secs = 4;
    repeated FacilityOpResult op_results = 5;
}

message HarvestRanchRequest {
    repeated int64 ranch_inst_ids = 2;
    int32 op = 3;
    repeated AnimalRef animals = 4;
    repeated ShelfRef shelves = 5;
}

message HarvestRanchReply {
    repeated RanchDetail ranches = 1;
    repeated FacilityOpResult op_results = 5;
    repeated GiantShareView giant_shares = 6;
}

message GiantShareView {
    int64 animal_id = 1;
    int32 weight_x10 = 2;
    int32 tier = 3;
}

message RanchHazardView {
    int64 hazard_id = 1;
    int64 owner = 2;
    int32 hazard_type = 3;
}

message PutHazardRequest {
    int64 ranch_inst_id = 1;
    int64 host_gid = 2;
    int64 op_id = 3;
    int64 count = 4;
}

message PutHazardReply {
    int64 actual_count = 1;
    int64 remaining_times = 2;
    repeated RanchHazardView hazards = 3;
    repeated Item rewards = 4;
}

message CleanRanchRequest {
    int64 host_gid = 1;
    repeated int64 hazard_ids = 2;
}

message CleanRanchReply {
    repeated RanchDetail ranches = 1;
    repeated FacilityOpResult op_results = 2;
}

message CleanAllRanchRequest {
    int64 host_gid = 1;
    repeated int64 ranch_inst_ids = 2;
}

message CleanAllRanchReply {
    repeated RanchDetail ranches = 1;
    repeated FacilityOpResult op_results = 2;
}

message GetRanchOpTimesRequest {
    repeated int64 op_ids = 1;
}

message GetRanchOpTimesReply {
    repeated RanchOpTimesView ops = 1;
}

message RanchOpTimesView {
    int64 op_id = 1;
    int64 times_limit = 2;
    int64 used_times = 3;
    int64 remaining_times = 4;
}

message StrokeAnimalRequest {
    int64 host_gid = 1;
    AnimalRef target = 2;
}

message StrokeAnimalReply {
    repeated RanchDetail ranches = 1;
    FacilityOpResult op_result = 2;
    bool triggered = 3;
    int64 remaining_times = 4;
}


// ==================== ranchpb：好友家园 / 背包 / 商店 / 图鉴 / 分享 ====================






message EnterHomesteadRequest {
    int64 host_gid = 1;
    int32 reason = 2;
}
message EnterHomesteadReply {
    FriendBasicInfo basic = 1;
    bool host_at_home = 3;
    int64 unix_milli = 5;
    bool is_tourist = 6;
    AllCellsReply homestead_cells = 8;
}
message LeaveHomesteadRequest { int64 host_gid = 1; }
message LeaveHomesteadReply {}
message FriendBasicInfo {
    int64 gid = 1;
    string name = 2;
    int64 big_farm_level = 20;
}
message StealProduceReply {
    repeated RanchDetail ranches = 1;
    repeated FacilityOpResult op_results = 4;
}
message FacilityOpResult {
    int64 facility_inst_id = 1;
    int32 kind = 2;
    int64 target_id = 3;
    repeated Item rewards = 10;
    repeated Item costs = 11;
}

message ReportShareRequest {
    int64 share_id = 1;
    repeated int64 params = 2;
    int32 channel = 3;
    int64 doc_id = 4;
}
message ReportShareReply {
    map<int64, ShareInfo> share_infos = 1;
}
message ClaimShareRewardRequest { int64 share_id = 1; }
message ClaimShareRewardReply {
    repeated Item rewards = 1;
    map<int64, ShareInfo> share_infos = 2;
    repeated Item compensated_items = 3;
}

// Scene 2 inventory preserves the official sale prices, locks and ranch-product details.

message Item {
    int64 id = 1;
    int64 count = 2;
    int64 expire_time = 3;
    int64 uid = 6;
    bool is_new = 7;
    repeated int64 mutant_types = 8;
    bool is_locked = 9;
    bytes gift_detail = 10;
    ItemDetail item_detail = 11;
    int64 tab_id = 12;
    ItemShow show = 100;
}

message ItemShow {
    repeated SellCond sell_cond = 3;
    repeated ItemEntry sells = 4;
    repeated ItemEntry cond_sells = 5;
}

message ItemDetail {
    bytes weather_wood = 1;
    ItemRanchProduct ranch_product = 2;
}

message ItemRanchProduct {
    int64 src_item_id = 1;
    int64 src_animal_id = 2;
    int32 weight_x10 = 3;
    int32 tier = 4;
    int64 price_rate = 5;
    int64 base_point = 6;
}

message ItemEntry {
    int64 id = 1;
    int64 count = 2;
}

message SellCond {
    string type = 1;
    string params = 2;
}

message GetBagRequest {
    int32 global_scene_id = 1;
    int64 tab_id = 2;
}

message GetBagReply {
    repeated Item physical_items = 1;
    repeated Item virtual_items = 2;
    int64 max_grid_num = 3;
    int64 curr_grid_num = 4;
    int32 global_scene_id = 5;
}

message GetBagTabRequest {
    int32 global_scene_id = 1;
}

message GetBagTabReply {
    repeated BagTabInfo tabs = 1;
    int32 global_scene_id = 2;
}

message BagTabInfo {
    int64 tab_id = 1;
    string tab_name = 2;
    int64 item_count = 3;
    bool has_red_dot = 4;
}

message UseRequest {
    Item item = 1;
}

message UseReply {
    Item item = 1;
    repeated Item get_items = 2;
    repeated Item compensated_items = 3;
}

message SellRequest {
    repeated Item items = 1;
}

message SellReply {
    repeated Item sell_items = 1;
    repeated Item get_items = 2;
}

message SceneData {
    AllCellsReply homestead_cells = 2;
}

message RotationGoodsCard {
    int32 shelf_id = 1;
    int32 slot = 2;
    int64 item_id = 3;
    int64 item_count = 4;
    int64 cost_item_id = 5;
    int64 cost_count = 6;
    int64 discount_price = 7;
    int64 discount_start_time = 8;
    int64 discount_end_time = 9;
    int64 limit_count = 10;
    int64 limit_used = 11;
    repeated ShowCond buy_conds = 12;
    int64 goods_id = 13;
}

message RotationShelf {
    int32 shelf_id = 1;
    string shelf_name = 2;
    int32 sort = 3;
}

message RotationShopState {
    int64 shop_id = 1;
    bool present = 2;
    int64 period_day = 3;
    int32 round_index = 4;
    int32 npc_id = 5;
    int64 shop_start_time = 6;
    int64 shop_end_time = 7;
    bool has_redpoint = 8;
    int64 npc_spawn_point_id = 9;
}

message RotationShopInfoRequest {
    int64 shop_id = 1;
}

message RotationShopInfoReply {
    bool opened = 1;
    bool present = 2;
    int64 period_day = 3;
    int32 round_index = 4;
    repeated RotationShelf shelves = 5;
    repeated RotationGoodsCard goods = 6;
}

message RotationBuyGoodsRequest {
    int64 goods_id = 1;
    int32 count = 2;
    int64 period_day = 3;
    int32 round_index = 4;
}

message RotationBuyGoodsReply {
    RotationGoodsCard card = 1;
